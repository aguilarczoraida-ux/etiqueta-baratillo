<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiqueta Producto</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 20px;
    }

    /* Etiqueta exacta 50mm x 30mm (todo en mm para que pantalla e impresión sean iguales) */
    .etiqueta {
      width: 50mm;
      height: 30mm;
      background: white;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1mm 1.5mm;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    /* Solo en pantalla: se ve más grande para revisar */
    @media screen {
      .etiqueta { zoom: 2.2; }
    }

    .categoria {
      font-size: 1.6mm;
      color: #555;
      width: 100%;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Nombre completo: hasta 2-3 líneas, sin cortar con "..." (se reduce la letra si hace falta) */
    .nombre {
      font-size: 2.8mm;
      font-weight: bold;
      color: #111;
      width: 100%;
      line-height: 1.15;
      height: 7.2mm;
      overflow: hidden;
      text-align: left;
    }

    .precio {
      font-size: 6.2mm;
      font-weight: bold;
      color: #c0392b;
      text-align: center;
      width: 100%;
      line-height: 1;
    }

    svg#barcode {
      width: 100%;
      height: 7.5mm;
    }

    .pie {
      width: 100%;
      font-size: 1.9mm;
      color: #333;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pie b { color: #000; }

    /* Controles de impresión — no se imprimen */
    .controles {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-imprimir {
      background: #2d5016;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-imprimir:hover { background: #5a8f2a; }

    .aviso {
      font-size: 12px;
      color: #666;
      text-align: center;
      max-width: 280px;
    }

    /* Al imprimir: solo la etiqueta, sin fondo, sin controles */
    @media print {
      body {
        background: white;
        margin: 0;
        padding: 0;
        min-height: 0;
        justify-content: flex-start;
      }

      .controles { display: none; }

      .etiqueta {
        border: none;
        box-shadow: none;
        width: 50mm;
        height: 30mm;
        padding: 1mm 1.5mm;
      }

      @page {
        size: 50mm 30mm;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="etiqueta">
    <div class="categoria" id="categoriaProducto"></div>
    <div class="nombre" id="nombreProducto">Cargando...</div>
    <div class="precio" id="precioProducto"></div>
    <svg id="barcode"></svg>
    <div class="pie">Cód: <span id="codFab"></span> · <b id="codCosto"></b></div>
  </div>

  <div class="controles">
    <button class="btn-imprimir" onclick="window.print()">
      🖨️ Imprimir etiqueta
    </button>
    <p class="aviso">
      Configura tu impresora con tamaño de papel <strong>50mm × 30mm</strong>
      y márgenes en <strong>0</strong> antes de imprimir.
    </p>
  </div>

  <script>
    // Costo codificado: 21.51 -> C21P51
    function codigoCosto(cc) {
      const n = parseFloat(String(cc).replace(',', '.'));
      if (isNaN(n)) return '';
      const partes = n.toFixed(2).split('.');
      return 'C' + partes[0] + 'P' + partes[1];
    }

    // Reduce la letra del nombre hasta que quepa completo
    function ajustarNombre() {
      const el = document.getElementById('nombreProducto');
      let size = 2.8;               // mm
      el.style.fontSize = size + 'mm';
      while (el.scrollHeight > el.clientHeight + 0.5 && size > 1.7) {
        size -= 0.1;
        el.style.fontSize = size + 'mm';
      }
    }

    // Leer parámetros de la URL
    const params  = new URLSearchParams(window.location.search);
    const id      = params.get('id')     || '';
    const nombre  = params.get('nombre') || 'Sin nombre';
    const precio  = params.get('precio') || '0.00';
    const cat     = params.get('cat')    || '';
    const fab     = params.get('fab')    || id;
    const cc      = params.get('cc')     || '';
    const barras  = params.get('barras') || '';

    // Rellenar datos
    document.getElementById('categoriaProducto').textContent = cat;
    document.getElementById('nombreProducto').textContent    = nombre;
    document.getElementById('precioProducto').textContent    = 'S/ ' + parseFloat(String(precio).replace(',', '.')).toFixed(2);
    document.getElementById('codFab').textContent            = fab;
    document.getElementById('codCosto').textContent          = codigoCosto(cc);

    ajustarNombre();
    window.addEventListener('beforeprint', ajustarNombre);

    // Código de barras con el valor registrado en AppSheet
    const svg = document.getElementById('barcode');

    function dibujarBarras(formato) {
      JsBarcode('#barcode', barras, {
        format:       formato,
        lineColor:    '#000',
        width:        2,
        height:       28,
        displayValue: true,
        fontSize:     11,
        textMargin:   1,
        margin:       0
      });
    }

    if (barras) {
      try {
        // Si son 13 dígitos válidos se imprime como EAN13; si no, CODE128
        if (/^\d{13}$/.test(barras)) {
          dibujarBarras('EAN13');
        } else {
          dibujarBarras('CODE128');
        }
      } catch (e) {
        dibujarBarras('CODE128');
      }
      // Asegura que el SVG se escale al espacio disponible
      if (!svg.getAttribute('viewBox')) {
        svg.setAttribute('viewBox', '0 0 ' + svg.getAttribute('width') + ' ' + svg.getAttribute('height'));
      }
    } else {
      svg.style.display = 'none';
    }
  </script>

</body>
</html>
